<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Mimetic — sistema adaptativo de conversão, tradução e transformação."
    >

    <title>Mimetic</title>
    <link rel="icon" type="image/png" href="img/Mimetic Ico.png">
    <link rel="stylesheet" href="css/mimetic.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div
        class="mimetic"
        aria-hidden="true"
    >
        <img
            class="parte superior"
            src="img/mimetic-superior.png"
            alt=""
        >

        <img
            class="logo-mimetic"
            src="img/logo-mimetic.png"
            alt=""
        >

        <img
            class="parte inferior"
            src="img/mimetic-inferior.png"
            alt=""
        >
    </div>

    <main class="site-main">
        <header class="site-header">
            <div class="marca">
                <img
                    class="marca-logo"
                    src="img/letreiro-mimetic.png"
                    alt="Mimetic"
                >

                <p class="marca-descricao">
                    Adaptive Conversion System
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span
                    class="wave-text"
                    aria-label="Conversão em tempo real"
                >
                    <span style="--i: 1;">C</span><span style="--i: 2;">o</span><span style="--i: 3;">n</span><span style="--i: 4;">v</span><span style="--i: 5;">e</span><span style="--i: 6;">r</span><span style="--i: 7;">s</span><span style="--i: 8;">ã</span><span style="--i: 9;">o</span>
                    <span class="espaco">&nbsp;</span>
                    <span style="--i: 11;">e</span><span style="--i: 12;">m</span>
                    <span class="espaco">&nbsp;</span>
                    <span style="--i: 14;">t</span><span style="--i: 15;">e</span><span style="--i: 16;">m</span><span style="--i: 17;">p</span><span style="--i: 18;">o</span>
                    <span class="espaco">&nbsp;</span>
                    <span style="--i: 20;">r</span><span style="--i: 21;">e</span><span style="--i: 22;">a</span><span style="--i: 23;">l</span>
                </span>
            </div>
        </header>

        <section class="workspace" aria-label="Conversor Mimetic">
            <nav
                class="categorias"
                id="categorias"
                aria-label="Categorias"
            ></nav>

            <div class="operacao-conversor">
                <label for="operacao">Operação</label>
                <select id="operacao">
                    <option value="encode">Criptografar</option>
                    <option value="decode">Descriptografar</option>
                </select>
            </div>

            <section class="tradutor">
                <article class="painel">
                    <header class="painel-topo">
                        <label for="origem">Origem</label>
                        <select id="origem"></select>
                    </header>

                    <div
                        class="configuracao"
                        id="configOrigem"
                    ></div>

                    <textarea
                        id="entrada"
                        placeholder="Digite ou cole alguma coisa..."
                        aria-label="Texto de origem"
                    ></textarea>

                    <footer class="painel-rodape">
                        <span id="contadorEntrada">0 caracteres</span>

                        <div class="acoes">
                            <button
                                class="botao-icone"
                                id="limpar"
                                title="Limpar entrada"
                                type="button"
                            >
                                ×
                            </button>

                            <button
                                class="botao-icone"
                                id="copiarEntrada"
                                title="Copiar entrada"
                                type="button"
                            >
                                ⧉
                            </button>
                        </div>
                    </footer>
                </article>

                <button
                    class="trocar"
                    id="trocar"
                    title="Inverter"
                    type="button"
                >
                    ⇄
                </button>

                <article class="painel">
                    <header class="painel-topo">
                        <label for="destino">Destino</label>
                        <select id="destino"></select>
                    </header>

                    <div
                        class="configuracao"
                        id="configDestino"
                    ></div>

                    <textarea
                        id="saida"
                        readonly
                        placeholder="O resultado aparecerá aqui..."
                        aria-label="Resultado"
                    ></textarea>

                    <footer class="painel-rodape">
                        <span id="contadorSaida">0 caracteres</span>

                        <div class="acoes">
                            <button
                                class="botao-icone"
                                id="copiarSaida"
                                title="Copiar resultado"
                                type="button"
                            >
                                ⧉
                            </button>
                        </div>
                    </footer>
                </article>
            </section>

            <section
                class="morse-tools"
                id="morseTools"
                aria-label="Ferramentas Morse"
            >
                <div class="morse-controles">
                    <button
                        class="morse-btn"
                        id="muteMorse"
                        type="button"
                    >
                        Som
                    </button>

                    <button
                        class="morse-btn"
                        id="manualMorse"
                        type="button"
                    >
                        Sinalização Manual
                    </button>

                    <button
                        class="morse-btn ativo"
                        id="timerMorse"
                        type="button"
                    >
                        Temporizador
                    </button>

                    <button
                        class="morse-btn"
                        id="playMorse"
                        type="button"
                    >
                        Reproduzir
                    </button>

                    <button
                        class="morse-btn"
                        id="espacoMorse"
                        type="button"
                    >
                        Espaço
                    </button>
                </div>

                <div
                    class="sinalizador-area"
                    id="sinalizadorArea"
                >
                    <button
                        id="botaoSinal"
                        type="button"
                    >
                        Segurar sinal
                    </button>

                    <div
                        class="timer"
                        id="timerDisplay"
                    >
                        0.000 s
                    </div>
                </div>
            </section>

            <p
                class="mensagem-sistema"
                id="mensagemSistema"
                role="status"
            ></p>
        </section>
    </main>
